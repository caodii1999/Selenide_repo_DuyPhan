name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Selenium Grid
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for Selenium Hub
        run: |
          echo "Waiting for Selenium Grid to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Grid is ready"; exit 0
            fi
            sleep 2
          done
          echo "Grid did not become ready in time"
          docker compose logs --no-color
          exit 1

      - name: Run tests
        run: mvn clean test

      - name: Teardown Grid
        if: always()
        run: docker compose down -v
