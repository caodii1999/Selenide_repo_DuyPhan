services:
  selenium-hub:
    image: selenium/hub:4.23.0
    container_name: selenium-hub
    ports: [ "4444:4444" ]
    environment:
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_SESSION_RETRY_INTERVAL=2
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:4444/status >/dev/null || wget -qO- http://localhost:4444/status >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  chrome:
    image: selenium/node-chrome:4.23.0
    shm_size: 2g
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_MAX_SESSIONS=1
    restart: unless-stopped

  firefox:
    image: selenium/node-firefox:4.23.0
    shm_size: 2g
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_MAX_SESSIONS=1
    restart: unless-stopped
